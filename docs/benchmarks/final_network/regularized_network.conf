{
    "inputs": 769,
    "seed": 100,
    "layers": [
        {"type": "dense", "outputs": 128, "activation": "relu", "initialization": "he"},
        {"type": "dropout", "rate": 0.2},
        {"type": "dense", "outputs": 64, "activation": "tanh", "initialization": "lecun"},
        {"type": "dropout", "rate": 0.2},
        {"type": "dense", "outputs": 5, "activation": "softmax", "initialization": "xavier"}
    ],
    "training": {
        "batch_size": 32,
        "optimizer": {
            "name": "momentum", "learning_rate": 0.01, "momentum": 0.9, "weight_decay": 0.0001,
            "schedule": {"name": "step_decay", "factor": 0.5, "every": 10}
        },
        "patience": 8,
        "max_epochs": 80
    },
    "metadata": {"description": "wider network with dropout and L2 regularisation against overfitting"}
}
